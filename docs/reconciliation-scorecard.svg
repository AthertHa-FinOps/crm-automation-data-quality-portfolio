<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 334" role="img" aria-labelledby="heading description">
<title id="heading">Illustrative CRM record-quality review scorecard</title>
<desc id="description">Fictional data: 700 source leads, 733 CRM rows preserved, 311 CRM rows flagged, 40 duplicate-email groups. Counts are not comparable percentages; flag categories overlap.</desc>
<rect width="1120" height="334" rx="22" fill="#f6f8fb"/>
<text x="36" y="52" fill="#243247" font-family="system-ui,Segoe UI,Arial" font-size="27" font-weight="700">CRM record-quality review</text>
<text x="36" y="77" fill="#53647a" font-family="system-ui,Segoe UI,Arial" font-size="14">Illustrative results from deliberately flawed fictional source and CRM extracts — not a live CRM screenshot</text>
<rect x="30" y="108" width="252" height="146" rx="13" fill="white" stroke="#d9e1eb"/>
<text x="49" y="153" fill="#344055" font-family="system-ui,Segoe UI,Arial" font-size="15">Source lead rows</text>
<text x="49" y="215" fill="#1c426e" font-family="system-ui,Segoe UI,Arial" font-size="50" font-weight="700">700</text>
<rect x="299" y="108" width="252" height="146" rx="13" fill="white" stroke="#d9e1eb"/>
<text x="318" y="153" fill="#344055" font-family="system-ui,Segoe UI,Arial" font-size="15">CRM rows preserved</text>
<text x="318" y="215" fill="#1c426e" font-family="system-ui,Segoe UI,Arial" font-size="50" font-weight="700">733</text>
<rect x="568" y="108" width="252" height="146" rx="13" fill="white" stroke="#d9e1eb"/>
<text x="587" y="153" fill="#344055" font-family="system-ui,Segoe UI,Arial" font-size="15">Rows needing review</text>
<text x="587" y="215" fill="#87510d" font-family="system-ui,Segoe UI,Arial" font-size="50" font-weight="700">311</text>
<rect x="837" y="108" width="252" height="146" rx="13" fill="white" stroke="#d9e1eb"/>
<text x="856" y="153" fill="#344055" font-family="system-ui,Segoe UI,Arial" font-size="15">Duplicate-email groups</text>
<text x="856" y="215" fill="#87510d" font-family="system-ui,Segoe UI,Arial" font-size="50" font-weight="700">40</text>
<text x="36" y="289" fill="#344055" font-family="system-ui,Segoe UI,Arial" font-size="15" font-weight="600">All original CRM rows retained. No automatic deletion, merging or approval.</text>
<text x="36" y="312" fill="#63748b" font-family="system-ui,Segoe UI,Arial" font-size="13">Planted defects; flags can overlap. Software checks are reproducible; human dispositions remain unapproved.</text>
</svg>
